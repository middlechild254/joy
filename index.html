<style>
  :root{
    --ivory:#FBF5EF; --paper:#FFFDFB; --plum:#4A1026; --plum2:#6B1B3B;
    --blush:#F3DEE2; --blush2:#E7B3BC; --gold:#A97D34; --gold2:#E4CFA0; --ink:#2B1620; --muted:#8A6E74;

  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#FFFDFB; } }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth; scroll-padding-top:90px}
  body{margin:0; background:var(--ivory); color:var(--ink); font-family:'Manrope',sans-serif; -webkit-font-smoothing:antialiased}
  .serif{font-family:'Fraunces',serif}
  .tracked{letter-spacing:.14em}
  @keyframes rise{from{opacity:0; transform:translateY(22px)} to{opacity:1; transform:translateY(0)}}
  .rise{animation:rise .7s cubic-bezier(.2,.7,.3,1) both}
  @keyframes drift{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-14px) rotate(6deg)}}
  .drift{animation:drift 7s ease-in-out infinite}
  @keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}70%{box-shadow:0 0 0 14px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
  .pulse-wa{animation:pulseRing 2.2s infinite}
  ::-webkit-scrollbar{width:10px} ::-webkit-scrollbar-thumb{background:var(--blush2); border-radius:8px}

  .swatch::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.55),transparent 60%)}
  .swatch-dark{background:linear-gradient(135deg,var(--plum) 0%,var(--plum2) 60%,#8a2a4f 100%)}
  .ba-wrap{touch-action:none}

<body>

<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo} = React;

/* ========= CONFIG — edit these to go live ========= */
const BUSINESS = {

  tagline:"Your Beauty. Your Confidence. Your Moment.",

const waLink = (text) => `https://wa.me/${BUSINESS.whatsapp}?text=${encodeURIComponent(text)}`;

/* ========= ICONS (inline, no deps) ========= */
const Icon = ({d,className="w-5 h-5",sw=1.8}) => (

const I = {

  pin:"M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 1 1 18 0z M12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z",
  star:"M12 2l3.1 6.6 7.2.9-5.3 5 1.4 7.2-6.4-3.5-6.4 3.5 1.4-7.2-5.3-5 7.2-.9z",
  check:"M20 6L9 17l-5-5", chev:"M9 18l6-6-6-6", left:"M15 18l-6-6 6-6", calendar:"M7 2v4M17 2v4M3 9h18M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z",
  clock:"M12 7v5l3 3M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z", x:"M6 6l12 12M18 6L6 18", ig:"M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5z M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M17.5 6.5h.01",
};
const Petal = ({className="w-24 h-24 text-[var(--gold)]"}) => (
  <svg viewBox="0 0 100 100" className={className} fill="none" stroke="currentColor" strokeWidth="1">
    <path d="M50 10C65 25 80 35 50 50C20 35 35 25 50 10Z"/><path d="M50 90C65 75 80 65 50 50C20 65 35 75 50 90Z"/>
    <path d="M10 50C25 35 35 20 50 50C35 80 25 65 10 50Z"/><path d="M90 50C75 35 65 20 50 50C65 80 75 65 90 50Z"/>
  </svg>
);

/* ========= DATA ========= */
const SERVICES = {
  Hair:[
    {n:"Dreadlock Styling",d:"Fresh retwist and styling for defined, healthy locs.",p:"From KSh 1,500",t:"90 min"},
    {n:"Wig Installation",d:"Natural-looking install with secure, comfortable fit.",p:"From KSh 2,000",t:"75 min"},
    {n:"Hair Treatment",d:"Deep conditioning and scalp treatment for healthy hair.",p:"From KSh 1,200",t:"60 min"},
    {n:"Back-to-School Styling",d:"Neat, protective styles built to last through term.",p:"From KSh 800",t:"45 min"},
  ],
  Nails:[
    {n:"Gel Manicure",d:"Long-lasting gel colour with cuticle care and shaping.",p:"From KSh 1,000",t:"45 min"},
    {n:"Pedicure",d:"Soak, scrub, shape and polish for soft, healthy feet.",p:"From KSh 1,200",t:"50 min"},
    {n:"Nail Art & Extensions",d:"Custom designs, tips and extensions, fully bespoke.",p:"From KSh 1,800",t:"75 min"},
    {n:"Bridal Nails",d:"Elegant nails designed to match your wedding look.",p:"From KSh 2,500",t:"60 min"},
  ],
  Makeup:[
    {n:"Soft Glam",d:"Natural, radiant makeup for everyday elegance.",p:"From KSh 2,500",t:"45 min"},
    {n:"Full Glam",d:"Bold contour, lashes and finish for events that matter.",p:"From KSh 3,500",t:"60 min"},
    {n:"Bridal Makeup",d:"A complete bridal look, trialled and perfected with you.",p:"From KSh 8,000",t:"120 min"},
    {n:"Graduation / Photoshoot",d:"Camera-ready makeup that photographs beautifully.",p:"From KSh 3,000",t:"50 min"},
  ],
};
const PACKAGES = [
  {n:"Bridal Glam",items:["Bridal makeup","Skin preparation","Lashes","Touch-up kit","Consultation"],price:"KSh 12,000"},
  {n:"Bridesmaid",items:["Professional makeup","Lashes","Skin prep","Personalised look"],price:"KSh 4,500 pp"},
  {n:"Soft Glam",items:["Skin preparation","Soft glam makeup","Lashes","Finishing spray"],price:"KSh 3,000"},
  {n:"Full Glam",items:["Full transformation","Contour & highlight","Lashes","Finishing"],price:"KSh 4,000"},
];
const TRANSFORM = [
  {cat:"Makeup",label:"Soft Glam → Full Bridal Glam"},
  {cat:"Hair",label:"Natural Hair → Fresh Dreadlock Retwist"},
  {cat:"Nails",label:"Bare Nails → Bridal Gel Set"},
];
const GALLERY = ["Makeup","Hair","Nails","Dreadlocks","Bridal","Wig Installation","Manicure","Pedicure"];
const REVIEWS = [
  {n:"Wanjiru K.",s:"Bridal Makeup",q:"My makeup lasted the entire wedding day and photographed beautifully. I felt like the best version of myself."},
  {n:"Achieng M.",s:"Dreadlock Styling",q:"Best retwist I've had in Thika. Neat, gentle hands and my locs have never looked healthier."},
  {n:"Faith N.",s:"Gel Manicure & Pedicure",q:"Clean space, friendly team, and the nail art was even better than the photo I showed them."},
];
const OCCASIONS = [["💍","Weddings"],["🎓","Graduation"],["🎂","Birthdays"],["📸","Photoshoots"],["🎉","Parties"],["🏫","Back to School"]];
const TIMES = ["9:00 AM","10:30 AM","12:00 PM","2:00 PM","4:00 PM"];

/* ========= SMALL UI PRIMITIVES ========= */
const Swatch = ({label,dark,className="",onClick}) => (
  <div onClick={onClick} className={`swatch ${dark?"swatch-dark":""} ${className} flex items-end p-4`}>
    <span className={`relative serif text-lg ${dark?"text-[var(--gold2)]":"text-[var(--plum)]"}`}>{label}</span>
  </div>
);
const Btn = ({children,onClick,variant="solid",className="",href}) => {
  const base = "inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-full font-semibold text-sm transition-all duration-200 active:scale-95";
  const styles = {
    solid:"bg-[var(--plum)] text-[var(--gold2)] hover:bg-[var(--plum2)] shadow-lg shadow-[var(--plum)]/20",
    gold:"bg-[var(--gold)] text-white hover:brightness-110 shadow-lg shadow-[var(--gold)]/30",
    outline:"border-2 border-[var(--plum)] text-[var(--plum)] hover:bg-[var(--plum)] hover:text-white",
    wa:"bg-[#25D366] text-white hover:brightness-105 shadow-lg shadow-[#25D366]/30",
    ghost:"text-[var(--plum)] hover:bg-[var(--blush)]",
  };
  const Tag = href ? 'a' : 'button';
  return <Tag href={href} target={href && href.startsWith('http') ? "_blank" : undefined} onClick={onClick} className={`${base} ${styles[variant]} ${className}`}>{children}</Tag>;
};
const Kicker = ({children}) => <p className="serif italic text-[var(--gold)] text-sm mb-2">{children}</p>;

/* ========= BEFORE/AFTER SLIDER ========= */
function BeforeAfter({item}){
  const [pos,setPos] = useState(50);
  const ref = useRef(null);
  const move = (clientX) => {
    const r = ref.current.getBoundingClientRect();
    let pct = ((clientX - r.left)/r.width)*100;
    pct = Math.max(2,Math.min(98,pct));
    setPos(pct);
  };
  return (
    <div className="rounded-2xl overflow-hidden shadow-xl shadow-[var(--plum)]/10 bg-white">
      <div ref={ref} className="ba-wrap relative h-72 sm:h-96 cursor-ew-resize select-none"
        onMouseDown={e=>{move(e.clientX); const h=ev=>move(ev.clientX); const u=()=>{window.removeEventListener('mousemove',h);window.removeEventListener('mouseup',u)}; window.addEventListener('mousemove',h); window.addEventListener('mouseup',u);}}
        onTouchStart={e=>move(e.touches[0].clientX)} onTouchMove={e=>move(e.touches[0].clientX)}>
        <div className="absolute inset-0 swatch-dark flex items-center justify-center"><span className="serif text-2xl text-[var(--gold2)]">AFTER</span></div>
        <div className="absolute inset-0 overflow-hidden" style={{width:`${pos}%`}}>
          <div className="absolute inset-y-0 left-0 swatch flex items-center justify-center" style={{width:ref.current?ref.current.getBoundingClientRect().width:400}}>
            <span className="serif text-2xl text-[var(--plum)]">BEFORE</span>
          </div>
        </div>
        <div className="absolute inset-y-0 w-0.5 bg-white shadow-lg" style={{left:`${pos}%`}}>
          <div className="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-9 h-9 rounded-full bg-white shadow-lg flex items-center justify-center text-[var(--plum)]">
            <Icon d={I.left} className="w-3.5 h-3.5 -mr-1"/><Icon d={I.chev} className="w-3.5 h-3.5 -ml-1"/>
          </div>
        </div>
        <span className="absolute top-3 left-3 text-[10px] tracked uppercase bg-white/90 px-2 py-1 rounded-full text-[var(--plum)] font-bold">Before</span>
        <span className="absolute top-3 right-3 text-[10px] tracked uppercase bg-[var(--plum)]/90 px-2 py-1 rounded-full text-[var(--gold2)] font-bold">After</span>
      </div>
      <div className="p-4 flex items-center justify-between">
        <div><p className="text-xs uppercase tracking-wide text-[var(--gold)] font-bold">{item.cat}</p><p className="serif text-[var(--plum)]">{item.label}</p></div>
        <Btn variant="ghost" onClick={()=>document.getElementById('book').scrollIntoView({behavior:'smooth'})}>Book <Icon d={I.chev} className="w-4 h-4"/></Btn>
      </div>
    </div>
  );
}

/* ========= BOOKING MODAL ========= */
function BookingModal({open,close,initial}){
  const [step,setStep] = useState(1);
  const [f,setF] = useState({category:initial||"Makeup",service:"",pkg:"",date:"",time:"",name:"",phone:"",notes:"",eventDate:"",people:"",location:""});
  useEffect(()=>{ if(open) setF(s=>({...s,category:initial||s.category, service:"",pkg:""})); setStep(1); },[open,initial]);
  if(!open) return null;
  const isBridal = f.category==="Bridal Package" || f.pkg==="Bridal Glam" || f.service==="Bridal Makeup" || f.service==="Bridal Nails";
  const set = (k,v)=>setF(s=>({...s,[k]:v}));
  const next = ()=>setStep(s=>Math.min(4,s+1));
  const back = ()=>setStep(s=>Math.max(1,s-1));
  const send = () => {
    const lines = [
      `Hello ${BUSINESS.name},`,"I would like to book an appointment.","",
      `Name: ${f.name}`, `Service: ${f.service||f.category}`, f.pkg&&`Package: ${f.pkg}`,
      `Date: ${f.date}`, `Time: ${f.time}`, `Phone: ${f.phone}`,
      isBridal && f.eventDate && `Event Date: ${f.eventDate}`,
      isBridal && f.location && `Event Location: ${f.location}`,
      isBridal && f.people && `Number of People: ${f.people}`,
      f.notes && "", f.notes && "Additional notes:", f.notes,
      "", "Please confirm availability and booking details.",
    ].filter(Boolean).join("\n");
    window.open(waLink(lines),"_blank");
  };
  const catList = Object.keys(SERVICES).concat(["Bridal Package","Other"]);
  const svcList = SERVICES[f.category] || [];
  return (
    <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center bg-black/50 backdrop-blur-sm p-0 sm:p-4" onClick={close}>
      <div className="bg-[var(--paper)] w-full sm:max-w-lg sm:rounded-3xl rounded-t-3xl max-h-[92vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="sticky top-0 bg-[var(--paper)] flex items-center justify-between px-6 py-4 border-b border-[var(--blush)]">
          <div><p className="text-xs tracked uppercase text-[var(--gold)] font-bold">Step {step} of 4</p><p className="serif text-xl text-[var(--plum)]">Book Your Appointment</p></div>
          <button onClick={close} className="p-2 text-[var(--plum)]"><Icon d={I.x}/></button>
        </div>
        <div className="p-6 space-y-5">
          {step===1 && <>
            <p className="font-semibold text-[var(--plum)]">What would you like to book?</p>
            <div className="grid grid-cols-2 gap-2">
              {catList.map(c=><button key={c} onClick={()=>set('category',c)} className={`px-4 py-3 rounded-xl text-sm font-medium border-2 transition ${f.category===c?'bg-[var(--plum)] text-white border-[var(--plum)]':'border-[var(--blush2)] text-[var(--plum)] hover:bg-[var(--blush)]'}`}>{c}</button>)}
            </div>
            {svcList.length>0 && <>
              <p className="font-semibold text-[var(--plum)] pt-2">Choose a specific service</p>
              <div className="flex flex-wrap gap-2">
                {svcList.map(s=><button key={s.n} onClick={()=>set('service',s.n)} className={`px-3 py-2 rounded-full text-xs font-medium border ${f.service===s.n?'bg-[var(--gold)] text-white border-[var(--gold)]':'border-[var(--blush2)] text-[var(--plum)]'}`}>{s.n}</button>)}
              </div>
            </>}
            {f.category==="Makeup" && <>
              <p className="font-semibold text-[var(--plum)] pt-2">Select a package (optional)</p>
              <div className="flex flex-wrap gap-2">
                {PACKAGES.map(p=><button key={p.n} onClick={()=>set('pkg',p.n===f.pkg?"":p.n)} className={`px-3 py-2 rounded-full text-xs font-medium border ${f.pkg===p.n?'bg-[var(--plum)] text-white border-[var(--plum)]':'border-[var(--blush2)] text-[var(--plum)]'}`}>{p.n}</button>)}
              </div>
            </>}
          </>}
          {step===2 && <>
            <p className="font-semibold text-[var(--plum)]">Pick a date & time</p>
            <input type="date" min={new Date().toISOString().split('T')[0]} value={f.date} onChange={e=>set('date',e.target.value)} className="w-full border-2 border-[var(--blush2)] rounded-xl px-4 py-3 text-[var(--plum)]"/>
            <div className="flex flex-wrap gap-2">
              {TIMES.map(t=><button key={t} onClick={()=>set('time',t)} className={`px-3 py-2 rounded-full text-xs font-medium border ${f.time===t?'bg-[var(--gold)] text-white border-[var(--gold)]':'border-[var(--blush2)] text-[var(--plum)]'}`}>{t}</button>)}
            </div>
            {isBridal && <div className="grid grid-cols-1 gap-3 pt-2 border-t border-[var(--blush)] mt-2">
              <p className="text-xs uppercase tracked text-[var(--gold)] font-bold">Bridal / event details</p>
              <input placeholder="Event date" type="date" value={f.eventDate} onChange={e=>set('eventDate',e.target.value)} className="border-2 border-[var(--blush2)] rounded-xl px-4 py-2.5"/>
              <input placeholder="Event location" value={f.location} onChange={e=>set('location',e.target.value)} className="border-2 border-[var(--blush2)] rounded-xl px-4 py-2.5"/>
              <input placeholder="Number of people" value={f.people} onChange={e=>set('people',e.target.value)} className="border-2 border-[var(--blush2)] rounded-xl px-4 py-2.5"/>
            </div>}
          </>}
          {step===3 && <>
            <p className="font-semibold text-[var(--plum)]">Your details</p>
            <input placeholder="Full name" value={f.name} onChange={e=>set('name',e.target.value)} className="w-full border-2 border-[var(--blush2)] rounded-xl px-4 py-3"/>
            <input placeholder="WhatsApp / phone number" value={f.phone} onChange={e=>set('phone',e.target.value)} className="w-full border-2 border-[var(--blush2)] rounded-xl px-4 py-3"/>
            <textarea placeholder="Additional notes (optional)" value={f.notes} onChange={e=>set('notes',e.target.value)} rows="3" className="w-full border-2 border-[var(--blush2)] rounded-xl px-4 py-3"/>
          </>}
          {step===4 && <>
            <p className="font-semibold text-[var(--plum)]">Review your booking</p>
            <div className="bg-[var(--blush)] rounded-xl p-4 space-y-1.5 text-sm">
              <p><b>Service:</b> {f.service||f.category}</p>
              {f.pkg && <p><b>Package:</b> {f.pkg}</p>}
              <p><b>Date:</b> {f.date||"—"} &nbsp; <b>Time:</b> {f.time||"—"}</p>
              <p><b>Name:</b> {f.name||"—"} &nbsp; <b>Phone:</b> {f.phone||"—"}</p>
              {isBridal && f.eventDate && <p><b>Event date:</b> {f.eventDate}</p>}
            </div>
            <p className="text-xs text-[var(--muted)]">You'll continue to WhatsApp with these details pre-filled to confirm availability.</p>
          </>}
        </div>
        <div className="sticky bottom-0 bg-[var(--paper)] flex gap-3 px-6 py-4 border-t border-[var(--blush)]">
          {step>1 && <Btn variant="outline" onClick={back}>Back</Btn>}
          {step<4 ? <Btn variant="solid" className="flex-1" onClick={next}>Continue</Btn>
                  : <Btn variant="wa" className="flex-1" onClick={send}><Icon d={I.wa} className="w-4 h-4"/>Confirm & Continue to WhatsApp</Btn>}
        </div>
      </div>
    </div>
  );
}

/* ========= LIGHTBOX ========= */
function Lightbox({item,close}){
  if(!item) return null;
  return (
    <div className="fixed inset-0 z-[70] bg-black/80 flex items-center justify-center p-4" onClick={close}>
      <div className="max-w-lg w-full bg-[var(--paper)] rounded-2xl overflow-hidden" onClick={e=>e.stopPropagation()}>
        <Swatch label={item} className="h-64 w-full"/>
        <div className="p-5 flex items-center justify-between">
          <div><p className="text-xs uppercase tracked text-[var(--gold)] font-bold">{item}</p><p className="text-sm text-[var(--muted)]">Sample project photo — replace with real client work.</p></div>
          <Btn variant="solid" onClick={close}>Book This</Btn>
        </div>
      </div>
    </div>
  );
}

/* ========= NAV ========= */
function Nav({openBook}){
  const [open,setOpen] = useState(false);
  const links = ["Services","Transformations","Gallery","Packages","Contact"];
  return (
    <header className="fixed top-0 inset-x-0 z-50 bg-[var(--paper)]/90 backdrop-blur-md border-b border-[var(--blush)]">
      <div className="max-w-6xl mx-auto px-5 h-20 flex items-center justify-between">
        <a href="#top" className="serif text-xl sm:text-2xl text-[var(--plum)] flex items-center gap-2"><Petal className="w-6 h-6 text-[var(--gold)]"/>Joy Beauty Parlour</a>
        <nav className="hidden md:flex items-center gap-8 text-sm font-medium text-[var(--plum)]">
          {links.map(l=><a key={l} href={`#${l.toLowerCase()}`} className="hover:text-[var(--gold)] transition">{l}</a>)}
        </nav>
        <div className="flex items-center gap-2">
          <Btn variant="solid" className="hidden sm:inline-flex !px-5 !py-2.5" onClick={openBook}>Book Now</Btn>
          <button onClick={()=>setOpen(true)} className="md:hidden p-2 text-[var(--plum)]"><Icon d={I.menu}/></button>
        </div>
      </div>
      <div className={`fixed inset-0 bg-[var(--plum)] text-[var(--gold2)] z-[80] transition-transform duration-300 md:hidden ${open?'translate-x-0':'translate-x-full'}`}>
        <div className="flex justify-end p-5"><button onClick={()=>setOpen(false)}><Icon d={I.x} className="w-7 h-7"/></button></div>
        <div className="flex flex-col items-center gap-6 pt-10 serif text-2xl">
          {links.map(l=><a key={l} href={`#${l.toLowerCase()}`} onClick={()=>setOpen(false)}>{l}</a>)}
          <Btn variant="gold" onClick={()=>{setOpen(false);openBook();}}>Book Now</Btn>
        </div>
      </div>
    </header>
  );
}
